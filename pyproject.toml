[project]
name = "schedule-bot"
version = "1.0.0"
description = "Telegram-бот расписания колледжа"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".local"]

[tool.ruff.lint]
# Ошибки, а не стиль: синтаксис, неопределённые и неиспользуемые имена, подозрительные конструкции
select = ["E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
